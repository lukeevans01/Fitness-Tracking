name: Process feedback replies

# Poll every 30 min, 24/7. No time window — replies are useful any time of day.
# 30-min interval keeps usage ~1,440 min/month, within the 2,000 min free tier.
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch: {}

jobs:
  poll-and-process:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Poll and process replies
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          TO_EMAIL: levans092@gmail.com
          FROM_EMAIL: "Luke's Fitness Bot <onboarding@resend.dev>"
        run: python3 process_replies.py

      - name: Commit changes if any
        run: |
          git config user.name "fitness-bot"
          git config user.email "bot@noreply"
          git add overrides.json feedback_log.jsonl state.json adaptation_state.md
          git add plans/pending-choice.json 2>/dev/null || true
          git add nutrition_log/ 2>/dev/null || true
          git diff --cached --quiet || git commit -m "feedback: overrides/state/nutrition updated ($(date -u +%FT%TZ))"
          git push

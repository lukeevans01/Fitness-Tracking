name: Telegram inbound

# Fired by the webhook at /api/telegram via repository_dispatch. Runs the handler, then
# commits any store change so the plan edit reaches the daily email and the dashboard.
#
# Concurrency is serialised: two updates arriving together would otherwise race on
# data/app.db and one commit would lose the other's write.
on:
  repository_dispatch:
    types: [telegram-message]

concurrency:
  group: telegram-inbound
  cancel-in-progress: false

jobs:
  handle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # to persist store changes
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Handle the update
        env:
          # Untrusted input: telegram_router re-checks the chat id before acting.
          TELEGRAM_UPDATE: ${{ toJSON(github.event.client_payload.update) }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python3 handle_telegram.py

      - name: Persist store changes if any
        run: |
          set -u
          git config user.name "fitness-bot"
          git config user.email "bot@noreply"
          git add data/app.db nutrition_log 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Nothing to persist."
            exit 0
          fi
          git commit -m "telegram: store updated ($(date -u +%FT%TZ))"

          # data/app.db is a SQLite blob, so git cannot merge two concurrent writes. A rebase
          # here left the repo on a detached HEAD and the push then failed outright, losing our
          # write entirely. Retry the push instead, and where the histories really have diverged
          # prefer our commit for the binary while still taking everything else from main.
          for attempt in 1 2 3; do
            if git push; then
              echo "Pushed on attempt $attempt."
              exit 0
            fi
            echo "Push rejected on attempt $attempt; reconciling with main."
            git fetch origin main
            if ! git merge -X ours --no-edit origin/main; then
              git merge --abort || true
              echo "::warning::Could not reconcile data/app.db with main automatically."
              exit 1
            fi
            echo "::warning::Merged a concurrent store update; our version of data/app.db won, so the other write may have been superseded."
            sleep 3
          done
          echo "::error::Could not push the store change after 3 attempts."
          exit 1

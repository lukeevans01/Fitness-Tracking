name: Daily fitness email

# Cron is UTC; send_daily.py gates on Amsterdam local time so DST is handled for free.
# It sends on the first run at/after 15:00 local and dedups with a per-day marker, so the
# rest skip. GitHub's scheduler routinely fires 1-2.5h late, so we take many shots: the
# early ones (from 13:00 UTC = 15:00 local in summer) aim to land before the preferred
# 20:00, and the later ones are a safety net so a day is never missed entirely (a late
# email beats none). Sending after 20:00 is allowed; the script just logs that it is late.
on:
  schedule:
    - cron: '0 13,14,15,16,17,18,19,20 * * *'
  workflow_dispatch: {} # allow manual runs from the Actions tab for testing

jobs:
  send-email:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # to persist the per-day "sent" marker back to data/app.db
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Send daily fitness email
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          TO_EMAIL: ${{ vars.TO_EMAIL || 'levans092@gmail.com' }}
          FROM_EMAIL: ${{ vars.FROM_EMAIL }}
        run: python3 send_daily.py

      - name: Persist sent marker if changed
        run: |
          git config user.name "fitness-bot"
          git config user.email "bot@noreply"
          git add data/app.db
          git diff --cached --quiet || git commit -m "state: daily email marker ($(date -u +%FT%TZ))"
          git push

name: Daily fitness email

# Cron is UTC; send_daily.py gates on Amsterdam local time (15:00-20:00 window) so DST is
# handled for free. GitHub's scheduler routinely fires 1-2.5h late, so we take several
# shots from 13:00 UTC (15:00 local in summer) onwards. The script dedups with a per-day
# marker, so the first qualifying run sends and the rest skip. Starting early means even a
# heavily delayed run still lands before the 20:00 local cut-off.
on:
  schedule:
    - cron: '0 13,14,15,16,17 * * *'
  workflow_dispatch: {} # allow manual runs from the Actions tab for testing

jobs:
  send-email:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # to persist the per-day "sent" marker back to data/app.db
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Send daily fitness email
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          TO_EMAIL: ${{ vars.TO_EMAIL || 'levans092@gmail.com' }}
          FROM_EMAIL: ${{ vars.FROM_EMAIL }}
        run: python3 send_daily.py

      - name: Persist sent marker if changed
        run: |
          git config user.name "fitness-bot"
          git config user.email "bot@noreply"
          git add data/app.db
          git diff --cached --quiet || git commit -m "state: daily email marker ($(date -u +%FT%TZ))"
          git push

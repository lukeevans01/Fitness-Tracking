name: Daily fitness email

# Cron is UTC. We fire at both 03:30 UTC (= 05:30 CEST, summer) and 04:30 UTC
# (= 05:30 CET, winter). The script checks Amsterdam local time and exits
# silently if it's not within 30 min of 05:30 local — so DST is handled for free.
on:
  schedule:
    - cron: '30 3,4 * * *'
  workflow_dispatch: {} # allow manual runs from the Actions tab for testing

jobs:
  send-email:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Send daily fitness email
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          TO_EMAIL: ${{ vars.TO_EMAIL || 'levans092@gmail.com' }}
          FROM_EMAIL: ${{ vars.FROM_EMAIL }}
        run: python3 send_daily.py

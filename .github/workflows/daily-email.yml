name: Daily fitness email

# Cron is UTC. 19:00 Amsterdam = 17:00 UTC (CEST, summer) or 18:00 UTC (CET, winter).
# Fire both; the script time-gates on Amsterdam local time so DST is handled for free.
on:
  schedule:
    - cron: '0 17,18 * * *'
  workflow_dispatch: {} # allow manual runs from the Actions tab for testing

jobs:
  send-email:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Send daily fitness email
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          TO_EMAIL: ${{ vars.TO_EMAIL || 'levans092@gmail.com' }}
          FROM_EMAIL: ${{ vars.FROM_EMAIL }}
        run: python3 send_daily.py

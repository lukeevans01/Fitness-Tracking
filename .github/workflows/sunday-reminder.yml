name: Sunday weekly summary

# 08:00 Amsterdam = 06:00 UTC (CEST) or 07:00 UTC (CET). Fire both; script gates on local time.
on:
  schedule:
    - cron: '0 6,7 * * 0'
  workflow_dispatch: {}

jobs:
  send-email:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Send Sunday summary
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          TO_EMAIL: ${{ vars.TO_EMAIL || 'levans092@gmail.com' }}
          FROM_EMAIL: ${{ vars.FROM_EMAIL }}
          # Optional Telegram mirror. Absent secrets simply skip the notification.
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 send_sunday.py

      - name: Commit store + plan view
        run: |
          git config user.name "fitness-bot"
          git config user.email "bot@noreply"
          git add data/app.db
          git add plans/current-week.md 2>/dev/null || true
          git diff --cached --quiet || git commit -m "plan: weekly summary + options updated ($(date -u +%FT%TZ))"
          git push

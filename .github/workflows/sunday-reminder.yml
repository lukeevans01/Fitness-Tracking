name: Sunday fitness check-in

# 18:00 Amsterdam = 16:00 UTC (CEST) or 17:00 UTC (CET). Fire both; script gates on local time.
on:
  schedule:
    - cron: '0 16,17 * * 0'
  workflow_dispatch: {}

jobs:
  send-email:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Send Sunday reminder
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          TO_EMAIL: ${{ vars.TO_EMAIL || 'levans092@gmail.com' }}
          FROM_EMAIL: ${{ vars.FROM_EMAIL }}
        run: python3 send_sunday.py
